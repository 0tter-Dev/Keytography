name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` reexecuta a verificação de nomes quando o título do PR muda.
    types: [opened, synchronize, reopened, edited]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          # Convenção de nomes de branches e PRs (BranchNamingTests); vazias em push, onde o teste não tem o que verificar.
          KEYTOGRAPHY_PR_BRANCH: ${{ github.head_ref }}
          KEYTOGRAPHY_PR_TITLE: ${{ github.event.pull_request.title }}

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typed API client is up to date with docs/reference/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Claude Code hook tests
        working-directory: .
        run: node --test ".claude/hooks/*.test.mjs"
